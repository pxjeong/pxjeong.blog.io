name: Blog and Tistory RSS

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sync-tistory:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import public RSS
        run: python3 scripts/sync_tistory.py
      - name: Save the archive when it changes
        run: |
          if git diff --quiet -- data/tistory.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tistory.json
          git commit -m 'Sync Tistory posts'
          git push origin HEAD:main

  build:
    needs: sync-tistory
    if: always() && github.ref == 'refs/heads/main' && (needs.sync-tistory.result == 'success' || needs.sync-tistory.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build the static site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the blog
        id: deployment
        uses: actions/deploy-pages@v4
